[package]
name    = "blop-db"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members  = ["crates/blop-db-macros"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[dependencies]
blop-db-macros = { path = "crates/blop-db-macros", version = "0.1.0" }
crc32c         = "0.6.8"
sha2           = "0.11.0"
tokio          = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio    = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }

[target."cfg(any(unix, windows))".dependencies]
getrandom = { version = "0.4.3", features = ["std"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[lints.clippy]
too_many_arguments = "allow"
